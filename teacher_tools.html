<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学老师实用工具箱 | Teacher's Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f0f4f8;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .tool-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s infinite ease-in-out;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: confetti-fall 3s linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-slate-800">

    <!-- Header -->
    <header class="max-w-6xl mx-auto mb-10 text-center">
        <div class="inline-flex items-center justify-center p-3 mb-4 bg-white rounded-2xl shadow-sm">
            <i data-lucide="graduation-cap" class="w-8 h-8 text-indigo-600 mr-2"></i>
            <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                小学老师实用工具箱
            </h1>
        </div>
        <p class="text-slate-500 font-medium">让课堂互动更简单、更有趣</p>
    </header>

    <!-- Main Grid -->
    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">

        <!-- Tool 1: Countdown Timer -->
        <section class="glass-card tool-card rounded-3xl p-6 relative overflow-hidden group">
            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                <i data-lucide="timer" class="w-24 h-24 text-indigo-500"></i>
            </div>
            <h2 class="text-xl font-bold mb-4 flex items-center text-slate-700">
                <i data-lucide="hourglass" class="w-6 h-6 mr-2 text-indigo-500"></i>
                课堂倒计时
            </h2>
            
            <div class="flex flex-col items-center justify-center space-y-6 py-4">
                <div id="timer-display" class="text-7xl font-mono font-bold text-slate-700 tabular-nums tracking-tighter">
                    05:00
                </div>
                
                <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
                    <div id="timer-progress" class="bg-indigo-500 h-4 rounded-full transition-all duration-1000 w-full"></div>
                </div>

                <div class="flex flex-wrap justify-center gap-2 w-full">
                    <button onclick="setTimer(1)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition-colors">1分钟</button>
                    <button onclick="setTimer(3)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition-colors">3分钟</button>
                    <button onclick="setTimer(5)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition-colors">5分钟</button>
                    <button onclick="setTimer(10)" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition-colors">10分钟</button>
                </div>

                <div class="flex space-x-3 w-full">
                    <button id="start-btn" onclick="startTimer()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-all shadow-lg shadow-indigo-200 active:scale-95">
                        <i data-lucide="play" class="w-5 h-5 mr-1"></i> 开始
                    </button>
                    <button id="pause-btn" onclick="pauseTimer()" class="hidden flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-all shadow-lg shadow-amber-200 active:scale-95">
                        <i data-lucide="pause" class="w-5 h-5 mr-1"></i> 暂停
                    </button>
                    <button onclick="resetTimer()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-all active:scale-95">
                        <i data-lucide="rotate-ccw" class="w-5 h-5 mr-1"></i> 重置
                    </button>
                </div>
            </div>
        </section>

        <!-- Tool 2: Random Picker -->
        <section class="glass-card tool-card rounded-3xl p-6 relative overflow-hidden group">
            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                <i data-lucide="dices" class="w-24 h-24 text-rose-500"></i>
            </div>
            <h2 class="text-xl font-bold mb-4 flex items-center text-slate-700">
                <i data-lucide="sparkles" class="w-6 h-6 mr-2 text-rose-500"></i>
                幸运点名器
            </h2>

            <div class="flex flex-col h-full bg-slate-50/50 rounded-2xl border border-slate-100 p-1">
                 <div id="picker-result-container" class="h-32 flex items-center justify-center mb-4 relative overflow-hidden bg-white rounded-xl shadow-inner border border-slate-100">
                    <span id="picker-result" class="text-3xl font-bold text-slate-300">等待抽选...</span>
                    <!-- Animation elements will be added here -->
                </div>

                <textarea id="student-names" class="w-full h-32 p-3 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none resize-none mb-3" placeholder="在此处输入学生姓名，用回车或逗号分隔..."></textarea>
                
                <button onclick="pickRandom()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-all shadow-lg shadow-rose-200 active:scale-95 group">
                    <i data-lucide="wand-2" class="w-5 h-5 mr-2 group-hover:animate-pulse"></i> 谁是幸运儿？
                </button>
            </div>
        </section>

        <!-- Tool 3: Group Generator -->
        <section class="glass-card tool-card rounded-3xl p-6 relative overflow-hidden group">
            <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                <i data-lucide="users" class="w-24 h-24 text-emerald-500"></i>
            </div>
            <h2 class="text-xl font-bold mb-4 flex items-center text-slate-700">
                <i data-lucide="users-round" class="w-6 h-6 mr-2 text-emerald-500"></i>
                随机分组助手
            </h2>

            <div class="game-container">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1 uppercase">分组数量</label>
                        <input type="number" id="group-count" min="2" max="20" value="4" class="w-full p-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-center font-mono">
                    </div>
                     <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1 uppercase">操作</label>
                        <button onclick="generateGroups()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded-xl transition-all shadow-lg shadow-emerald-200 active:scale-95">
                        开始分组
                        </button>
                    </div>
                </div>
                
                 <textarea id="group-names-input" class="w-full h-24 p-3 text-sm bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none resize-none mb-4" placeholder="在此处输入所有学生姓名，用回车分隔..."></textarea>

                <div id="groups-output" class="grid grid-cols-2 gap-2 h-40 overflow-y-auto pr-1">
                    <!-- Groups will appear here -->
                    <div class="flex items-center justify-center col-span-2 h-full text-slate-400 text-sm italic border-2 border-dashed border-slate-200 rounded-xl">
                        分组结果将显示在这里
                    </div>
                </div>
            </div>
        </section>

        <!-- Tool 4: Simple Scoreboard -->
        <section class="glass-card tool-card rounded-3xl p-6 relative overflow-hidden group">
             <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                <i data-lucide="trophy" class="w-24 h-24 text-amber-500"></i>
            </div>
            <h2 class="text-xl font-bold mb-4 flex items-center text-slate-700">
                <i data-lucide="award" class="w-6 h-6 mr-2 text-amber-500"></i>
                小组计分板
            </h2>

            <div class="grid grid-cols-2 gap-4" id="scoreboard-container">
                <!-- Team 1 -->
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col items-center">
                    <div class="w-full flex justify-between items-center mb-2">
                        <input type="text" value="第一组" class="w-20 text-sm font-bold text-center bg-transparent border-b border-transparent hover:border-slate-300 focus:border-amber-500 outline-none">
                        <button onclick="removeTeam(this)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="text-4xl font-bold text-slate-700 mb-3 tabular-nums score-display">0</div>
                    <div class="flex gap-2">
                        <button onclick="updateScore(this, -1)" class="p-2 rounded-lg bg-slate-100 hover:bg-red-100 hover:text-red-600 transition-colors"><i data-lucide="minus" class="w-4 h-4"></i></button>
                         <button onclick="updateScore(this, 1)" class="p-2 rounded-lg bg-slate-100 hover:bg-green-100 hover:text-green-600 transition-colors"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                </div>

                <!-- Team 2 -->
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col items-center">
                    <div class="w-full flex justify-between items-center mb-2">
                        <input type="text" value="第二组" class="w-20 text-sm font-bold text-center bg-transparent border-b border-transparent hover:border-slate-300 focus:border-amber-500 outline-none">
                         <button onclick="removeTeam(this)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="text-4xl font-bold text-slate-700 mb-3 tabular-nums score-display">0</div>
                    <div class="flex gap-2">
                        <button onclick="updateScore(this, -1)" class="p-2 rounded-lg bg-slate-100 hover:bg-red-100 hover:text-red-600 transition-colors"><i data-lucide="minus" class="w-4 h-4"></i></button>
                         <button onclick="updateScore(this, 1)" class="p-2 rounded-lg bg-slate-100 hover:bg-green-100 hover:text-green-600 transition-colors"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
            
            <button onclick="addTeam()" class="w-full mt-4 py-2 border-2 border-dashed border-slate-300 text-slate-400 rounded-xl hover:border-amber-500 hover:text-amber-500 font-medium transition-colors flex items-center justify-center">
                <i data-lucide="plus-circle" class="w-5 h-5 mr-2"></i> 添加小组
            </button>
        </section>

    </main>
    
    <footer class="text-center text-slate-400 text-sm pb-8">
        Designed for Education | © 2026 AntiGravity
    </footer>

    <!-- Audio Effects -->
    <audio id="sound-timer-end" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="sound-pop" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3"></audio>

    <script>
        // Init Icons
        lucide.createIcons();

        // --- Timer Logic ---
        let timerInterval;
        let timeLeft = 300; // 5 minutes default
        let initialTime = 300;
        let isRunning = false;
        const display = document.getElementById('timer-display');
        const progress = document.getElementById('timer-progress');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            display.textContent = formatTime(timeLeft);
            const percentage = (timeLeft / initialTime) * 100;
            progress.style.width = `${percentage}%`;
            
            if (percentage < 20) {
                progress.classList.remove('bg-indigo-500', 'bg-amber-500');
                progress.classList.add('bg-red-500');
            } else if (percentage < 50) {
                progress.classList.remove('bg-indigo-500', 'bg-red-500');
                progress.classList.add('bg-amber-500');
            } else {
                progress.classList.remove('bg-amber-500', 'bg-red-500');
                progress.classList.add('bg-indigo-500');
            }
        }

        function setTimer(minutes) {
            pauseTimer();
            initialTime = minutes * 60;
            timeLeft = initialTime;
            updateDisplay();
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = initialTime;
            updateDisplay();
            display.classList.remove('text-red-500', 'animate-pulse');
        }

        function finishTimer() {
            pauseTimer();
            display.classList.add('text-red-500', 'animate-pulse');
            document.getElementById('sound-timer-end').play().catch(e => console.log('Audio play failed', e));
            createConfetti();
        }

        // --- Picker Logic ---
        let isPicking = false;
        
        // Sample names if empty
        const sampleNames = "张三, 李四, 王五, 赵六, 孙七, 周八, 吴九, 郑十";
        
        function pickRandom() {
            if (isPicking) return;
            
            const textarea = document.getElementById('student-names');
            const resultEl = document.getElementById('picker-result');
            let text = textarea.value.trim();
            
            // If empty, use sample for demo
            if (!text) {
                textarea.value = sampleNames;
                text = sampleNames;
            }

            const names = text.split(/[\n,，]+/).map(n => n.trim()).filter(n => n);
            
            if (names.length === 0) {
                resultEl.textContent = "请先输入姓名";
                return;
            }

            isPicking = true;
            resultEl.classList.remove('text-slate-300');
            resultEl.classList.add('text-indigo-600');
            
            let count = 0;
            const maxCount = 20;
            const interval = setInterval(() => {
                const randomName = names[Math.floor(Math.random() * names.length)];
                resultEl.textContent = randomName;
                document.getElementById('sound-pop').play().catch(() => {});
                count++;
                
                if (count >= maxCount) {
                    clearInterval(interval);
                    isPicking = false;
                    resultEl.classList.add('text-4xl', 'text-rose-600');
                    createConfetti();
                }
            }, 100);
        }

        // --- Group Logic ---
        function generateGroups() {
            const textarea = document.getElementById('group-names-input');
            const countInput = document.getElementById('group-count');
            const output = document.getElementById('groups-output');
            
            let text = textarea.value.trim();
            if (!text) {
                textarea.value = sampleNames; // Reuse sample
                text = sampleNames;
            }

            const names = text.split(/[\n,，]+/).map(n => n.trim()).filter(n => n);
            const groupCount = parseInt(countInput.value) || 2;
            
            if (names.length === 0) return;

            // Shuffle
            for (let i = names.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [names[i], names[j]] = [names[j], names[i]];
            }

            // Distribute
            const groups = Array.from({ length: groupCount }, () => []);
            names.forEach((name, i) => {
                groups[i % groupCount].push(name);
            });

            // Render
            output.innerHTML = '';
            groups.forEach((group, i) => {
                const div = document.createElement('div');
                div.className = 'bg-white p-3 rounded-xl border border-slate-100 text-sm shadow-sm';
                div.innerHTML = `
                    <div class="font-bold text-emerald-600 mb-1">第 ${i + 1} 组 <span class="text-slate-400 text-xs font-normal">(${group.length}人)</span></div>
                    <div class="text-slate-600 leading-relaxed">${group.join(', ')}</div>
                `;
                output.appendChild(div);
            });
        }

        // --- Scoreboard Logic ---
        function updateScore(btn, change) {
            const container = btn.closest('div').parentElement;
            const scoreEl = container.querySelector('.score-display');
            let score = parseInt(scoreEl.textContent);
            score += change;
            if (score < 0) score = 0; // Optional: allow negative? Nah, better 0 floor for kids
            scoreEl.textContent = score;
            
            // Animation for change
            scoreEl.classList.add('scale-125', 'text-purple-600');
            setTimeout(() => {
                scoreEl.classList.remove('scale-125', 'text-purple-600');
            }, 200);
        }

        function removeTeam(btn) {
            if (confirm('确定删除这个小组吗？')) {
                btn.closest('.bg-white').remove();
            }
        }

        function addTeam() {
            const container = document.getElementById('scoreboard-container');
            const count = container.children.length + 1;
            
            const div = document.createElement('div');
            div.className = 'bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col items-center animate-bounce-in';
            div.innerHTML = `
                 <div class="w-full flex justify-between items-center mb-2">
                    <input type="text" value="新小组" class="w-20 text-sm font-bold text-center bg-transparent border-b border-transparent hover:border-slate-300 focus:border-amber-500 outline-none">
                    <button onclick="removeTeam(this)" class="text-slate-300 hover:text-red-400"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
                <div class="text-4xl font-bold text-slate-700 mb-3 tabular-nums score-display">0</div>
                <div class="flex gap-2">
                    <button onclick="updateScore(this, -1)" class="p-2 rounded-lg bg-slate-100 hover:bg-red-100 hover:text-red-600 transition-colors"><i data-lucide="minus" class="w-4 h-4"></i></button>
                        <button onclick="updateScore(this, 1)" class="p-2 rounded-lg bg-slate-100 hover:bg-green-100 hover:text-green-600 transition-colors"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
            `;
            container.appendChild(div);
            lucide.createIcons();
        }
        
        // --- Confetti Effect ---
        function createConfetti() {
            const colors = ['#f43f5e', '#ec4899', '#8b5cf6', '#6366f1', '#3b82f6', '#10b981', '#f59e0b'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.opacity = Math.random();
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 4000);
            }
        }
    </script>
</body>
</html>
